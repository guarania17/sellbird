product:
  name: "GuaranIA — Automatización Empresarial e Inteligencia Artificial"
  description: "Ayudamos a empresas y PyMEs a identificar dónde pierden tiempo y dinero por procesos manuales, tareas repetitivas o falta de integración, resolviéndolo mediante automatización e Inteligencia Artificial práctica."
  pricing: "Presupuestos personalizados según alcance y retorno de inversión esperado"
  key_benefits:
    - "Reducción directa de horas dedicadas a tareas manuales y repetitivas"
    - "Atención comercial y seguimiento de clientes más ágil sin aumentar la carga operativa"
    - "Integración de herramientas existentes y eliminación de silos de información"
    - "Desarrollo de software y automatizaciones a medida adaptadas a la operativa real"
  objection_responses:
    "ya tenemos un sistema / ERP": "Excelente. No buscamos reemplazar las herramientas que ya utilizan. Las mayores oportunidades suelen estar en conectar esos sistemas existentes para eliminar tareas manuales que hoy se hacen a mano entre pantallas."
    "no necesitamos inteligencia artificial": "Totalmente comprensible. No todas las empresas necesitan IA. Nuestro trabajo parte de revisar si existe algún proceso que realmente valga la pena optimizar. Si no hay una oportunidad con retorno claro, no recomendamos implementar tecnología por implementarla."
    "cuanto cuesta": "Depende del proceso y del alcance. Trabajamos con propuestas adaptadas a cada empresa. Primero buscamos entender el problema y determinar si existe una oportunidad que justifique la inversión."
    "no tenemos tiempo": "Lo comprendemos perfectamente. Precisamente buscamos ayudar a reducir la carga operativa, no sumar más trabajo ni reuniones innecesarias. El Radar de Oportunidades lo preparamos por nuestra cuenta."
    "enviame mas informacion": "Con gusto. Para enviarte algo que realmente aplique a tu realidad, ¿qué área te genera más fricción hoy: la gestión comercial, la carga administrativa o la atención de consultas?"
